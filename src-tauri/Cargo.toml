[package]
name = "extension-copier"
version = "0.1.0"
description = "Copy Chrome extensions from one profile to another"
edition = "2021"

[lib]
name = "extension_copier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sys-locale = "0.3"
