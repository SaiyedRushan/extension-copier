# Builds the Windows and Linux installers and attaches them to a GitHub release
# when one is published. The signed and notarized Mac .dmg is made locally with
# scripts/release.sh, since it needs the Developer ID certificate.
#
# Run it by hand from the Actions tab to build the installers without a release;
# they're then available as downloads on the run's page.
name: Windows and Linux installers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Give the installers consistent names
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle=src-tauri/target/release/bundle
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bundle"/nsis/*-setup.exe "out/Extension-Copier-$version-windows-x64-setup.exe"
          else
            cp "$bundle"/appimage/*.AppImage "out/Extension-Copier-$version-linux-x86_64.AppImage"
            cp "$bundle"/deb/*.deb "out/Extension-Copier-$version-linux-amd64.deb"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*
      - name: Attach them to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
